metadata:
  annotations:
    cec.cilium.io/use-original-source-address: "false"
  labels:
    gateway.networking.k8s.io/gateway-name: my-gateway
  name: cilium-gateway-my-gateway
  namespace: default
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    controller: true
    kind: Gateway
    name: my-gateway
    uid: ""
spec:
  backendServices:
  - name: auth-service
    namespace: default
    number:
    - "8888"
  - name: my-service
    namespace: default
    number:
    - "8080"
  resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    filterChains:
    - filterChainMatch:
        transportProtocol: raw_buffer
      filters:
      - name: envoy.filters.network.http_connection_manager
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          commonHttpProtocolOptions:
            maxStreamDuration: 0s
          httpFilters:
          - name: envoy.filters.http.grpc_web
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.grpc_stats
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_stats.v3.FilterConfig
              emitFilterState: true
              enableUpstreamStats: true
          - name: io.cilium.external_auth.route_metadata
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              defaultSourceCode:
                inlineString: |-
                  local available_filters = {
                    ["NDpIVFRQMjU6ZGVmYXVsdDphdXRoLXNlcnZpY2U6ODg4ODU6L2F1dGgxOjAxOjExNDpYLUN1c3RvbS1Ub2tlbjE6MTExOlgtQXV0aC1Vc2Vy"] = true,
                  }

                  function envoy_on_request(request_handle)
                    local selected_filter = "!legacy"
                    local route_metadata = request_handle:metadata()
                    if route_metadata ~= nil then
                      local configured = route_metadata:get("selected_filter")
                      if configured == "!disabled" or available_filters[configured] then
                        selected_filter = configured
                      elseif configured ~= nil then
                        request_handle:respond({[":status"] = "503"}, "")
                        return
                      end
                    end
                    request_handle:streamInfo():dynamicMetadata():set("io.cilium.external_auth", "selected_filter", selected_filter)
                    request_handle:clearRouteCache()
                  end
          - name: envoy.filters.http.ext_authz/HTTP:default:auth-service:8888:pp:/auth:arh:X-Custom-Token:esh:X-Auth-User
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              allowedHeaders:
                patterns:
                - exact: X-Custom-Token
                  ignoreCase: true
              decoderHeaderMutationRules:
                disallowExpression:
                  regex: ^(:authority|host|content-length)$
              filterEnabledMetadata:
                filter: io.cilium.external_auth
                path:
                - key: selected_filter
                value:
                  orMatch:
                    valueMatchers:
                    - stringMatch:
                        exact: '!legacy'
                    - stringMatch:
                        exact: NDpIVFRQMjU6ZGVmYXVsdDphdXRoLXNlcnZpY2U6ODg4ODU6L2F1dGgxOjAxOjExNDpYLUN1c3RvbS1Ub2tlbjE6MTExOlgtQXV0aC1Vc2Vy
              httpService:
                authorizationResponse:
                  allowedUpstreamHeaders:
                    patterns:
                    - exact: X-Auth-User
                      ignoreCase: true
                pathPrefix: /auth
                serverUri:
                  cluster: http:default:auth-service:8888
                  timeout: 10s
                  uri: http://auth-service:8888
          - name: envoy.filters.http.router
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          internalAddressConfig:
            cidrRanges:
            - addressPrefix: 10.0.0.0
              prefixLen: 8
            - addressPrefix: 172.16.0.0
              prefixLen: 12
            - addressPrefix: 192.168.0.0
              prefixLen: 16
            - addressPrefix: 127.0.0.1
              prefixLen: 32
            - addressPrefix: ::1
              prefixLen: 128
          rds:
            routeConfigName: listener-insecure
          statPrefix: listener-insecure
          streamIdleTimeout: 300s
          upgradeConfigs:
          - upgradeType: websocket
          useRemoteAddress: true
    listenerFilters:
    - name: envoy.filters.listener.tls_inspector
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    name: listener
    socketOptions:
    - description: Enable TCP keep-alive (default to enabled)
      intValue: "1"
      level: "1"
      name: "9"
    - description: TCP keep-alive idle time (in seconds) (defaults to 10s)
      intValue: "10"
      level: "6"
      name: "4"
    - description: TCP keep-alive probe intervals (in seconds) (defaults to 5s)
      intValue: "5"
      level: "6"
      name: "5"
    - description: TCP keep-alive probe max failures.
      intValue: "10"
      level: "6"
      name: "6"
  - '@type': type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: listener-insecure
    virtualHosts:
    - domains:
      - '*'
      name: '*'
      routes:
      - match:
          dynamicMetadata:
          - filter: io.cilium.external_auth
            path:
            - key: selected_filter
            value:
              stringMatch:
                exact: NDpIVFRQMjU6ZGVmYXVsdDphdXRoLXNlcnZpY2U6ODg4ODU6L2F1dGgxOjAxOjExNDpYLUN1c3RvbS1Ub2tlbjE6MTExOlgtQXV0aC1Vc2Vy
          prefix: /
        metadata:
          filterMetadata:
            io.cilium.external_auth.route_metadata:
              selected_filter: NDpIVFRQMjU6ZGVmYXVsdDphdXRoLXNlcnZpY2U6ODg4ODU6L2F1dGgxOjAxOjExNDpYLUN1c3RvbS1Ub2tlbjE6MTExOlgtQXV0aC1Vc2Vy
        route:
          cluster: default:my-service:8080
          maxStreamDuration:
            maxStreamDuration: 0s
        typedPerFilterConfig:
          envoy.filters.http.ext_authz/HTTP:default:auth-service:8888:pp:/auth:arh:X-Custom-Token:esh:X-Auth-User:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
            disabled: false
      - directResponse:
          status: 503
        match:
          prefix: /
        metadata:
          filterMetadata:
            io.cilium.external_auth.route_metadata:
              generation_fallback: true
              selected_filter: NDpIVFRQMjU6ZGVmYXVsdDphdXRoLXNlcnZpY2U6ODg4ODU6L2F1dGgxOjAxOjExNDpYLUN1c3RvbS1Ub2tlbjE6MTExOlgtQXV0aC1Vc2Vy
        typedPerFilterConfig:
          envoy.filters.http.ext_authz/HTTP:default:auth-service:8888:pp:/auth:arh:X-Custom-Token:esh:X-Auth-User:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
            disabled: true
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    edsClusterConfig:
      serviceName: default/my-service:8080
    name: default:my-service:8080
    outlierDetection:
      splitExternalLocalOriginErrors: true
    type: EDS
    typedExtensionProtocolOptions:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        commonHttpProtocolOptions:
          idleTimeout: 60s
        useDownstreamProtocolConfig:
          http2ProtocolOptions: {}
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    edsClusterConfig:
      serviceName: default/auth-service:8888
    name: http:default:auth-service:8888
    outlierDetection:
      splitExternalLocalOriginErrors: true
    type: EDS
    typedExtensionProtocolOptions:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        commonHttpProtocolOptions:
          idleTimeout: 60s
        useDownstreamProtocolConfig:
          http2ProtocolOptions: {}
  services:
  - name: cilium-gateway-my-gateway
    namespace: default
    ports:
    - 80
